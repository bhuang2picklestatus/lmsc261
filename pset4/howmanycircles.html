<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);
    
    let numCircles = prompt("How many circles crody");
    const maxRadius = w * 0.45;
    const radiusIncr = maxRadius / numCircles;

    for(let i = 0; i < numCircles; i++) {
        let radius = radiusIncr * (i + 1);

        ctx.beginPath();
        ctx.arc(w / 2, h / 2, radius, 0, Math.Pi * 2);
        ctx.strokeStyle = "green";
        ctx.stroke();
    }

</script>
