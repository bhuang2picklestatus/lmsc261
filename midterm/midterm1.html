
<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

// sky
ctx.fillStyle = "lightblue";
ctx.fillRect(0, 0, 600, 120);

// ocean
ctx.fillStyle = "steelblue";
ctx.fillRect(0, 120, 600, 360);

ctx.strokeStyle = "white";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(0, 120);
ctx.lineTo(600, 120);
ctx.stroke();

// sand
ctx.fillStyle = "tan";
ctx.fillRect(0, 480, 600, 120);

// fish body
ctx.fillStyle = "lightseagreen";
ctx.beginPath();
ctx.ellipse(300, 300, 90, 80, 0, 0, 2 * Math.PI);
ctx.fill();

// fish tail
ctx.fillStyle = "lightseagreen";
ctx.beginPath();
ctx.moveTo(240, 300);
ctx.lineTo(175, 265);
ctx.lineTo(185, 335);
ctx.closePath();
ctx.fill();

// fish fin
ctx.beginPath();
ctx.moveTo(275, 235);
ctx.lineTo(275, 190);
ctx.lineTo(340, 245);
ctx.closePath();
ctx.fill();

// fish eyes
ctx.fillStyle = "black";
ctx.beginPath();
ctx.arc(320, 280, 8, 0, 2 * Math.PI);
ctx.fill();

ctx.beginPath();
ctx.arc(389, 280, 7, -Math.PI / 1.5, Math.PI / 2);
ctx.fill();

// gills
ctx.strokeStyle = "teal";
ctx.lineWidth = 4;

ctx.beginPath();
ctx.arc(260, 300, 25, 2, 4);
ctx.stroke();

ctx.beginPath();
ctx.arc(280, 300, 25, 2, 4);
ctx.stroke();

ctx.beginPath();
ctx.arc(300, 300, 25, 2, 4);
ctx.stroke();

// mouth
ctx.strokeStyle = "black";
ctx.lineWidth = 3;

ctx.beginPath();
ctx.arc(367, 310, 10, -Math.PI / 2, Math.PI / 1.5);
ctx.stroke();

ctx.beginPath();
ctx.arc(367, 290, 10, -Math.PI / 1.5, Math.PI / 2);
ctx.stroke();

</script>
</html>
